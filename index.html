<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planer</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Planer">
<meta name="theme-color" content="#0f1216">
<style>
:root{--bg:#0f1216;--card:#1a1e24;--tx:#eceff2;--mu:#98a1ad;--bd:#2a3038;--ac:#5b7bff;--in:#2fbf84;--ex:#f06a63;--szk:#eab33a;--prc:#5b7bff;--inn:#a77ee0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#0f1216;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 10px}h2{margin:2px 0;font-size:20px}h3{margin:0 0 8px;font-size:15px;text-transform:capitalize}
.top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
#bg{position:fixed;inset:0;z-index:-1;background:center/cover no-repeat}
body.hasbg .card,body.hasbg .day{background:rgba(26,30,36,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tab,.nav,button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
.tab.on,.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.mon{flex:1;text-align:center;font-weight:600;text-transform:capitalize;min-width:120px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cards .card{margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.dh{text-align:center;color:var(--mu);font-size:12px}
.day{background:var(--card);border:1px solid var(--bd);border-radius:8px;min-height:62px;padding:4px;cursor:pointer;overflow:hidden}
.day.sel{outline:2px solid var(--ac)}.day.today b{color:var(--ac)}
.dots{display:flex;gap:2px;flex-wrap:wrap;margin:2px 0}.dots i{width:7px;height:7px;border-radius:50%}
.day small{font-size:10px;display:block}
.p{color:var(--in)}.n{color:var(--ex)}.mu{color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd)}
.row span:nth-child(2){flex:1}.row button{padding:2px 8px}
.tag{color:#fff;border-radius:6px;padding:1px 7px;font-size:12px}
.f{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
input,select{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:7px;font:inherit;min-width:0}
.f input[name=title],.f input[name=note]{flex:1 1 160px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%}
.bud{margin-bottom:10px}.bud .row{border:0}.bud input{width:110px}
@media(max-width:520px){.cards{grid-template-columns:1fr}.day{min-height:52px}}
</style>
</head>
<body>
<div id="bg"></div>
<main>
<h1>📅 Planer</h1>
<div class="top">
  <button class="tab" data-t="cal" onclick="go('cal')">Kalendarz</button>
  <button class="tab" data-t="fin" onclick="go('fin')">Finanse</button>
  <button class="tab" data-t="bud" onclick="go('bud')">Budżet</button>
  <button class="tab" data-t="calc" onclick="go('calc')">Kalkulator</button>
</div>
<div class="top">
  <button class="nav" onclick="shift(-1)">‹</button><div class="mon" id="mon"></div><button class="nav" onclick="shift(1)">›</button>
</div>
<div id="app"></div>
<div class="mu" style="font-size:12px">Dane zapisują się w tej przeglądarce na tym urządzeniu.
<div class="f"><label class="tab" style="cursor:pointer">🖼 Zmień tło<input type="file" accept="image/*" hidden onchange="pickBg(this)"></label><button onclick="clearBg()">Usuń tło</button></div>
<div id="dimwrap" style="display:none;margin-top:8px">Przyciemnienie <input id="dim" type="range" min="0.2" max="0.9" step="0.05" oninput="setDim(this.value)"></div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const CEX=['Jedzenie','Transport','Rachunki','Rozrywka','Zakupy','Zdrowie','Inne'];
const CIN=['Wypłata','Zlecenie','Stypendium','Prezent','Inne'];
const EVC={'Szkoła':'--szk','Praca':'--prc','Inne':'--inn'};
let S={events:[],tx:[],budgets:{}};
try{const r=localStorage.getItem('planer1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.calc=Object.assign({amount:'',fixed:[],save:10,useHist:true,w:{}},S.calc||{});
const save=()=>{try{localStorage.setItem('planer1',JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const money=n=>n.toLocaleString('pl-PL',{style:'currency',currency:'PLN'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const opt=a=>a.map(c=>'<option>'+c+'</option>').join('');
let cur=new Date();cur=new Date(cur.getFullYear(),cur.getMonth(),1);
let sel=ymd(new Date()),tab='cal';
const mk=()=>cur.getFullYear()+'-'+pad(cur.getMonth()+1);

function sums(m){let i=0,e=0;const by={};
  S.tx.filter(t=>t.date.startsWith(m)).forEach(t=>{if(t.type==='in')i+=t.amount;else{e+=t.amount;by[t.cat]=(by[t.cat]||0)+t.amount}});
  return{i,e,by}}

const txRow=(t,d)=>'<div class="row">'+(d?'<small class="mu">'+t.date.slice(8)+'.'+t.date.slice(5,7)+'</small>':'')+
  '<span class="'+(t.type==='in'?'p':'n')+'">'+(t.type==='in'?'+':'−')+money(t.amount)+'</span>'+
  '<span>'+esc(t.cat)+(t.note?' · '+esc(t.note):'')+'</span><button onclick="delTx(\''+t.id+'\')">×</button></div>';

function calView(){
  const y=cur.getFullYear(),mo=cur.getMonth();
  const first=(new Date(y,mo,1).getDay()+6)%7,days=new Date(y,mo+1,0).getDate(),today=ymd(new Date());
  let h='<div class="grid">'+['Pn','Wt','Śr','Cz','Pt','So','Nd'].map(d=>'<div class="dh">'+d+'</div>').join('');
  for(let i=0;i<first;i++)h+='<div></div>';
  for(let d=1;d<=days;d++){
    const ds=y+'-'+pad(mo+1)+'-'+pad(d);
    const ev=S.events.filter(e=>e.date===ds),tx=S.tx.filter(t=>t.date===ds);
    const net=tx.reduce((a,t)=>a+(t.type==='in'?t.amount:-t.amount),0);
    h+='<div class="day'+(ds===sel?' sel':'')+(ds===today?' today':'')+'" onclick="pick(\''+ds+'\')"><b>'+d+'</b><div class="dots">'+
      ev.slice(0,5).map(e=>'<i style="background:var('+(EVC[e.cat]||'--inn')+')"></i>').join('')+'</div>'+
      (tx.length?'<small class="'+(net>=0?'p':'n')+'">'+(net>0?'+':'')+Math.round(net)+'</small>':'')+'</div>';
  }
  h+='</div>';
  const ev=S.events.filter(e=>e.date===sel).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const tx=S.tx.filter(t=>t.date===sel);
  h+='<div class="card"><h3>'+new Date(sel+'T00:00').toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'})+'</h3>'+
    (ev.map(e=>'<div class="row"><span class="tag" style="background:var('+(EVC[e.cat]||'--inn')+')">'+e.cat+'</span><span>'+(e.time?e.time+' ':'')+esc(e.title)+'</span><button onclick="delEv(\''+e.id+'\')">×</button></div>').join('')||'<p class="mu">Brak wydarzeń tego dnia</p>')+
    tx.map(t=>txRow(t,false)).join('')+
    '<form onsubmit="addEv(event)" class="f"><input name="title" placeholder="Nowe wydarzenie" required><select name="cat"><option>Szkoła</option><option>Praca</option><option>Inne</option></select><input name="time" type="time"><button class="pri">Dodaj</button></form></div>';
  return h;
}

function finView(){
  const m=mk(),s=sums(m);
  const list=S.tx.filter(t=>t.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date));
  const yr=S.tx.filter(t=>t.type==='in'&&t.date.startsWith(String(cur.getFullYear()))).reduce((a,t)=>a+t.amount,0);
  return '<div class="cards"><div class="card"><small class="mu">Przychód</small><h2 class="p">'+money(s.i)+'</h2></div>'+
    '<div class="card"><small class="mu">Wydatki</small><h2 class="n">'+money(s.e)+'</h2></div>'+
    '<div class="card"><small class="mu">Bilans</small><h2>'+money(s.i-s.e)+'</h2></div></div>'+
    '<p class="mu">Przychód od początku roku '+cur.getFullYear()+': <b>'+money(yr)+'</b></p>'+
    '<div class="card"><h3>Dodaj wpis</h3><form onsubmit="addTx(event)" class="f"><select name="type" onchange="swap(this)"><option value="in">Przychód</option><option value="ex">Wydatek</option></select>'+
    '<input name="amount" type="number" step="0.01" min="0.01" placeholder="Kwota (zł)" required><select name="cat">'+opt(CIN)+'</select>'+
    '<input name="date" type="date" value="'+sel+'" required><input name="note" placeholder="Notatka (opcjonalnie)"><button class="pri">Dodaj</button></form></div>'+
    '<div class="card"><h3>Wpisy w tym miesiącu</h3>'+(list.map(t=>txRow(t,true)).join('')||'<p class="mu">Brak wpisów</p>')+'</div>';
}

function budView(){
  const s=sums(mk()),tb=CEX.reduce((a,c)=>a+(S.budgets[c]||0),0);
  return '<div class="card"><h3>Budżet miesięczny</h3><p class="mu">Ustaw limit dla każdej kategorii. Pasek pokazuje wydatki z wybranego miesiąca.</p>'+
    CEX.map(c=>{const b=S.budgets[c]||0,sp=s.by[c]||0,p=b?Math.min(100,sp/b*100):0,over=b&&sp>b;
      return '<div class="bud"><div class="row"><b style="flex:1">'+c+'</b><input type="number" min="0" value="'+(b||'')+'" placeholder="limit zł" onchange="setB(\''+c+'\',this.value)"></div>'+
      '<div class="bar"><i style="width:'+p+'%;background:var('+(over?'--ex':'--in')+')"></i></div>'+
      '<small class="mu">Wydano '+money(sp)+(b?(over?' · przekroczono o '+money(sp-b):' z '+money(b)+' · zostało '+money(b-sp)):'')+'</small></div>'}).join('')+
    '<p>Suma limitów: <b>'+money(tb)+'</b><br>Przychód minus limity: <b class="'+(s.i-tb>=0?'p':'n')+'">'+money(s.i-tb)+'</b></p></div>';
}

const FLEX=['Jedzenie','Transport','Rozrywka','Zakupy','Zdrowie','Inne'];
const DEFW={Jedzenie:35,Transport:15,Rozrywka:15,Zakupy:15,Zdrowie:5,Inne:15};
function hist(){const t=new Date(),ms=[];
  for(let k=1;k<=3;k++){const d=new Date(t.getFullYear(),t.getMonth()-k,1);ms.push(d.getFullYear()+'-'+pad(d.getMonth()+1))}
  const by={};let n=0;
  ms.forEach(m=>{const x=sums(m);if(x.e>0){n++;for(const c in x.by)by[c]=(by[c]||0)+x.by[c]}});
  if(!n)return null;for(const c in by)by[c]/=n;return by}
function calcCalc(){
  const C=S.calc,amt=parseFloat(C.amount)||0;
  const fixedSum=C.fixed.reduce((a,f)=>a+f.amount,0),sv=amt*(C.save/100);
  const rest=Math.max(0,amt-fixedSum-sv),h=C.useHist?hist():null;
  let H=0;if(h)FLEX.forEach(c=>H+=h[c]||0);
  const w={};FLEX.forEach(c=>{let v=DEFW[c];if(h&&H>0)v=0.7*((h[c]||0)/H*100)+0.3*DEFW[c];if(C.w[c]!==undefined)v=C.w[c];w[c]=v});
  const tw=FLEX.reduce((a,c)=>a+w[c],0)||1,out={};
  FLEX.forEach(c=>out[c]=rest*w[c]/tw);
  return{amt,fixedSum,sv,rest,w,out,hasHist:!!(h&&H>0)}}
function calcView(){
  const C=S.calc,r=calcCalc(),pc=v=>r.amt?Math.min(100,v/r.amt*100):0;
  const row=(n,v,col)=>'<div class="bud"><div class="row"><b style="flex:1">'+n+'</b><span>'+money(v)+'</span></div><div class="bar"><i style="width:'+pc(v)+'%;background:var('+col+')"></i></div></div>';
  return '<div class="card"><h3>Kalkulator budżetu</h3>'+
   '<div class="f"><input type="number" min="0" value="'+(C.amount||'')+'" placeholder="Kwota do rozdzielenia (zł)" onchange="cset(\'amount\',this.value)"><button onclick="cfill()">Przychód z tego miesiąca</button></div>'+
   '<p>Oszczędności (% kwoty): <input type="number" min="0" max="90" style="width:70px" value="'+C.save+'" onchange="cset(\'save\',parseFloat(this.value)||0)"></p>'+
   '<label class="mu"><input type="checkbox" '+(C.useHist?'checked':'')+' onchange="cset(\'useHist\',this.checked)"> Uwzględnij moją historię wydatków (ostatnie 3 miesiące)</label></div>'+
   '<div class="card"><h3>Stałe koszty</h3>'+
   (C.fixed.map(f=>'<div class="row"><span>'+money(f.amount)+'</span><span>'+esc(f.name)+'</span><button onclick="delFixed(\''+f.id+'\')">×</button></div>').join('')||'<p class="mu">Dodaj rzeczy płacone co miesiąc: czynsz, rachunki, telefon, subskrypcje, raty.</p>')+
   '<form onsubmit="addFixed(event)" class="f"><input name="name" placeholder="Nazwa" required><input name="amount" type="number" step="0.01" min="0.01" placeholder="Kwota zł" required><button class="pri">Dodaj</button></form></div>'+
   '<div class="card"><h3>Proponowany podział</h3>'+
   (r.amt?(r.fixedSum+r.sv>r.amt?'<p class="n">Stałe koszty i oszczędności przekraczają kwotę.</p>':'')+
    row('Stałe koszty',r.fixedSum,'--prc')+row('Oszczędności',r.sv,'--in')+
    FLEX.map(c=>'<div class="bud"><div class="row"><b style="flex:1">'+c+'</b><small class="mu">waga</small><input type="number" min="0" style="width:64px" value="'+Math.round(r.w[c])+'" onchange="cw(\''+c+'\',this.value)"><span style="min-width:90px;text-align:right">'+money(r.out[c])+'</span></div><div class="bar"><i style="width:'+pc(r.out[c])+'%;background:var(--szk)"></i></div></div>').join('')+
    '<p class="mu">'+(r.hasHist?'Podział uwzględnia Twoje wydatki z ostatnich miesięcy.':'Brak historii wydatków, więc użyto ogólnych proporcji.')+' Wagi przeliczają się automatycznie, a zmiana jednej zmienia podział reszty. To narzędzie do planowania, nie porada finansowa.</p>'+
    '<div class="f"><button class="pri" onclick="capply()">Zastosuj jako limity</button><button onclick="creset()">Zresetuj wagi</button></div>'
   :'<p class="mu">Wpisz kwotę powyżej, a pokażę podział.</p>')+'</div>';
}
function cset(k,v){S.calc[k]=v;save();render()}
function cfill(){S.calc.amount=Math.round(sums(mk()).i*100)/100||'';save();render()}
function cw(c,v){const n=parseFloat(v);if(isNaN(n)||n<0)delete S.calc.w[c];else S.calc.w[c]=n;save();render()}
function creset(){S.calc.w={};save();render()}
function addFixed(e){e.preventDefault();const f=e.target.elements;S.calc.fixed.push({id:uid(),name:f.name.value.trim(),amount:parseFloat(f.amount.value)});save();render()}
function delFixed(id){S.calc.fixed=S.calc.fixed.filter(x=>x.id!==id);save();render()}
function capply(){const r=calcCalc();FLEX.forEach(c=>S.budgets[c]=Math.round(r.out[c]));S.budgets['Rachunki']=Math.round(r.fixedSum);save();go('bud')}
function render(){
  $('#mon').textContent=cur.toLocaleDateString('pl-PL',{month:'long',year:'numeric'});
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#app').innerHTML=tab==='cal'?calView():tab==='fin'?finView():tab==='calc'?calcView():budView();
}
function go(t){tab=t;render()}
function shift(n){cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);render()}
function pick(d){sel=d;render()}
function swap(el){el.form.elements.cat.innerHTML=opt(el.value==='in'?CIN:CEX)}
function addEv(e){e.preventDefault();const f=e.target.elements;
  S.events.push({id:uid(),date:sel,title:f.title.value.trim(),cat:f.cat.value,time:f.time.value});save();render()}
function addTx(e){e.preventDefault();const f=e.target.elements;
  S.tx.push({id:uid(),date:f.date.value,type:f.type.value,cat:f.cat.value,amount:parseFloat(f.amount.value),note:f.note.value.trim()});
  const d=new Date(f.date.value+'T00:00');cur=new Date(d.getFullYear(),d.getMonth(),1);sel=f.date.value;save();render()}
function delEv(id){S.events=S.events.filter(x=>x.id!==id);save();render()}
function delTx(id){S.tx=S.tx.filter(x=>x.id!==id);save();render()}
function setB(c,v){S.budgets[c]=parseFloat(v)||0;save();render()}
const BG_KEY='planer_bg',DIM_KEY='planer_dim';
function applyBg(){let img=null,dim=0.55;
  try{img=localStorage.getItem(BG_KEY);const d=localStorage.getItem(DIM_KEY);if(d!==null)dim=parseFloat(d)}catch(e){}
  const b=$('#bg');
  if(img){const g='rgba(15,18,22,'+dim+')';b.style.backgroundImage='linear-gradient('+g+','+g+'),url("'+img+'")';document.body.classList.add('hasbg')}
  else{b.style.backgroundImage='none';document.body.classList.remove('hasbg')}
  $('#dim').value=dim;$('#dimwrap').style.display=img?'block':'none'}
function pickBg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    try{localStorage.setItem(BG_KEY,c.toDataURL('image/jpeg',0.8))}catch(e){alert('Nie udało się zapisać tła.')}
    applyBg()};im.src=r.result};r.readAsDataURL(f);inp.value=''}
function clearBg(){try{localStorage.removeItem(BG_KEY)}catch(e){}applyBg()}
function setDim(v){try{localStorage.setItem(DIM_KEY,v)}catch(e){}applyBg()}
render();
applyBg();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
